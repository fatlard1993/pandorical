// The gametest setup every mod in the suite shares, applied with one line:
//
//     apply from: file("../pandorical/gametest.gradle")
//
// Kept here rather than copied into sixty-eight build files, so the window size, the run levels
// and the check wiring are one decision instead of sixty-eight that drift.
//
// Two levels, chosen with -Ptest.level:
//
//     ./gradlew runClientGameTest                    smoke: does this mod load and reach a world
//     ./gradlew runClientGameTest -Ptest.level=full  full:  everything, including screens and clicks
//
// The level reaches the test through a system property, because the test runs in the game's own
// process and not in Gradle's.

// Only for the mod being built. Pandorical is a subproject of twenty-nine others, and without this
// guard every one of them grew a :pandorical:runClientGameTest task that ran Pandorical's own tests
// on a classpath that has no Pandorical on it: NoClassDefFoundError on its own API.
if (project == rootProject) {

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "${project.name}-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

apply from: file("../pandorical/testsupport.gradle")

// A client gametest drives the client, so it compiles against the client source set. Loom does not
// wire that up, and the tests only ever compiled because the last build had left classes in the
// output directory: a directory that happens to hold classes is not a dependency. After a clean,
// compileGametestJava ran first and could not find one client class.
if (sourceSets.findByName('client') != null) {
	sourceSets.named('gametest') {
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

// The window is 854x480 unless it is told otherwise, and a screenshot taken larger than the window
// leaves the HUD laid out for the small one: the hotbar ends up a postage stamp in the corner.
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	// The client output directory is on the run classpath, but nothing said it had to hold anything
	// first: from a clean tree the game launched against an empty one and died looking for the mod's
	// own entrypoint. It only ever passed because a build had happened to run before it.
	if (sourceSets.findByName('client') != null) dependsOn 'clientClasses'
	args("--width", "1920", "--height", "1080")
	// Silent: OpenAL's null device ("OpenAL initialized on device No Output" in the log). Set on the
	// game's own process, so it holds under a Gradle daemon too, which an exported variable does not.
	environment("ALSOFT_DRIVERS", "null")
	// -Ppictures: Pictures.shoot keeps each shot in the mod's screenshots/ folder too.
	systemProperty("pandorical.pictures", project.hasProperty("pictures"))
	systemProperty("pandorical.test.level", project.findProperty("test.level") ?: "smoke")
}

// Compiling the tests, which is what catches an API change the tests no longer match: a renamed
// method fails here rather than at the next launch. It does not run them - a client gametest
// starts a real Minecraft and takes minutes, and `check` is on the path of every build of all
// forty mods. Running them is `runClientGameTest`, and it is a deliberate act.
tasks.named('check') { dependsOn 'gametestClasses' }

// Runs them, under the screen size they need, for when you mean it: ./gradlew verify
tasks.register('verify') {
	group = 'verification'
	description = 'Compiles and runs this mod\'s client gametests'
	dependsOn 'check', 'runClientGameTest'
}

}
