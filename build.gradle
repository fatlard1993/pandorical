plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.17'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

loom {
    accessWidenerPath = file("src/main/resources/pandorical.accesswidener")
    splitEnvironmentSourceSets()

    mods {
        "pandorical" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// src/gametest: runClientGameTest launches a client that applies every mixin, joins a world
// The game window is 854x480 unless it is told otherwise, and a screenshot taken larger than the
// window leaves the HUD and any open screen laid out for the small one: the hotbar ends up a
// postage stamp in the top left corner. Size the window to the picture instead, and run under an
// xvfb screen at least as big: xvfb-run -a -s "-screen 0 2048x1152x24" ./gradlew runClientGameTest
// and opens a screen. It opens a window: run it under xvfb-run, which Loom adds itself when CI is
// set. The setup itself is shared with every other mod in the suite; see the file for the levels.
apply from: file("gametest.gradle")

// Fabric tests these predicates against the loader's *normalized* game version,
// not Mojang's id: 26.3-snapshot-10 is compared as 26.3-alpha.10. So a floor of
// ">=26.3" is false on every 26.3 snapshot, and writing the obvious thing makes
// the mod refuse to load on the version it was built for. Derived from the pin
// rather than written into the manifest, so the two cannot drift apart.
def mcFloor = project.minecraft_version
    .replaceFirst(/-snapshot-/, '-alpha.')
    .replaceFirst(/-pre-/, '-pre.')
    .replaceFirst(/-rc-/, '-rc.')
// The trailing dash is load-bearing: "<26.4" would still admit 26.4's snapshots,
// because a prerelease sorts below its own release.
def mcParts = mcFloor.tokenize('.-')
def minecraftDependency = ">=${mcFloor} <${mcParts[0]}.${(mcParts[1] as int) + 1}-"
// The +26.3 build tag is ignored in comparison; the floor is the number.
def fabricApiFloor = ">=" + project.fabric_version.replaceFirst(/\+.*$/, '')

processResources {
    inputs.property "version", project.version
    inputs.property "minecraftDependency", minecraftDependency
    inputs.property "loaderVersion", project.loader_version
    inputs.property "fabricApiVersion", fabricApiFloor

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraftDependency": minecraftDependency,
               "loaderVersion": project.loader_version,
               "fabricApiVersion": fabricApiFloor
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
    // A doc comment that attaches to nothing is one an edit left behind.
    it.options.compilerArgs << "-Xlint:dangling-doc-comments" << "-Werror"
}

// Automated join testing: makes runClient connect straight to a server,
// e.g. ./gradlew runClient -PquickJoin=localhost:25565
// Appended in doFirst: loom composes its own game args during configuration,
// and this must land after them, right before exec
if (project.hasProperty('quickJoin')) {
    tasks.named('runClient') {
        doFirst {
            args('--quickPlayMultiplayer', project.property('quickJoin').toString())
            logger.lifecycle("runClient game args: {}", args)
        }
    }
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    // Always written, so its time says when it was last built: dependent.gradle refuses a jar
    // older than the source, and Gradle judges up-to-date by content, not by time.
    outputs.upToDateWhen { false }
    // Smoke lives in src/main because the twenty-nine mods that build against this one consume
    // its main output, and that is the only source set they see. Players consume the jar, and a
    // test harness is no use to them: it goes no further than the classes directory.
    exclude 'justfatlard/pandorical/gametest/**' 
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    // The readme rides in the jar beside the licence, so a server can show it in-game.
    from("README.md") {
        rename { "README_${project.base.archivesName.get()}.md" }
    }
}

// The gametest harness, in a jar of its own.
//
// Smoke lives in src/main because the mods that build against this one compile against its jar,
// and that jar is the one players install: a test harness in it is dead weight on every client.
// So it is cut from that jar and published beside it, and gametest.gradle puts this on the test
// classpath of every mod in the suite. Nobody's build file changes.
tasks.register('testSupportJar', Jar) {
    archiveClassifier = 'testsupport'
    from sourceSets.main.output
    include 'justfatlard/pandorical/gametest/**'
    // Same reasoning as the main jar: dependent.gradle compares times, and Gradle judges
    // up-to-date by content.
    outputs.upToDateWhen { false }
}
tasks.named('build') { dependsOn 'testSupportJar' }
tasks.named('assemble') { dependsOn 'testSupportJar' }

tasks.register('syncClient', Copy) {
    dependsOn build
    def deployDir = findProperty('devClientModsDir')
    onlyIf { deployDir != null }
    from("build/libs/${project.archives_base_name}-${project.mod_version}.jar")
    into(deployDir ?: layout.buildDirectory.dir('deploy').get())
    description = 'Deploy pandorical JAR to the dev client mods folder (set -PdevClientModsDir=... or it no-ops).'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}
