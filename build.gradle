plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.17'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

loom {
    accessWidenerPath = file("src/main/resources/pandorical.accesswidener")
    splitEnvironmentSourceSets()

    mods {
        "pandorical" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

// Automated join testing: makes runClient connect straight to a server,
// e.g. ./gradlew runClient -PquickJoin=localhost:25565
// Appended in doFirst: loom composes its own game args during configuration,
// and this must land after them, right before exec
if (project.hasProperty('quickJoin')) {
    tasks.named('runClient') {
        doFirst {
            args('--quickPlayMultiplayer', project.property('quickJoin').toString())
            logger.lifecycle("runClient game args: {}", args)
        }
    }
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.register('syncClient', Copy) {
    dependsOn build
    def deployDir = findProperty('devClientModsDir')
    onlyIf { deployDir != null }
    from("build/libs/${project.archives_base_name}-${project.mod_version}.jar")
    into(deployDir ?: layout.buildDirectory.dir('deploy').get())
    description = 'Deploy pandorical JAR to the dev client mods folder (set -PdevClientModsDir=... or it no-ops).'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}
