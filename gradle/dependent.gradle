// Applied by the mods that compile against Pandorical's API but only suggest it at runtime.
// A mod that depends on Pandorical outright includes it as a subproject instead; DEVELOPMENT.md
// has both.
//
// Pandorical is a BUILD-TIME REQUIREMENT and a RUNTIME OPTION for these mods. They name
// Pandorical types directly, so javac needs the jar; at runtime the classes that touch it sit
// behind FabricLoader.isModLoaded and are never loaded without it.
//
// The requirement is unconditional, so a missing jar stops the build with the command that makes
// it, rather than a wall of "package justfatlard.pandorical does not exist".
//
// The jar is named by the version Pandorical declares, and refused when Pandorical's source is
// newer than it: either way a stale jar would otherwise compile green against an API that has
// since moved.

def pandoricalRoot = project.file("../pandorical")
def pandoricalProperties = new File(pandoricalRoot, "gradle.properties")
def pandoricalVersion = new Properties().with {
	pandoricalProperties.withInputStream { load(it) }
	getProperty("mod_version")?.trim()
}
def pandoricalJar = new File(pandoricalRoot, "build/libs/pandorical-${pandoricalVersion}.jar")
def rebuild = "  ./gradlew build -p ${pandoricalRoot.path}\n" +
	"  (or, with the suite's tools: mc-build pandorical)\n" +
	"Pandorical stays optional at runtime; this is a build-time dependency only."

if (!pandoricalJar.exists()) {
	throw new GradleException(
		"${project.name} compiles against Pandorical's API, and pandorical ${pandoricalVersion} is not built:\n" + rebuild)
}

def newerSource = fileTree(new File(pandoricalRoot, "src")).files.find { it.lastModified() > pandoricalJar.lastModified() }
if (newerSource != null) {
	throw new GradleException(
		"${project.name} compiles against Pandorical's API, and ${newerSource.path} is newer than\n" +
		"${pandoricalJar.name}, so the API it would compile against is out of date:\n" + rebuild)
}

dependencies {
	compileOnly files(pandoricalJar)
}
